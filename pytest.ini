[pytest]
# pytest配置文件

# 测试路径
testpaths = tests

# Python文件模式
python_files = test_*.py *_test.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 添加标记
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_sdk: marks tests as requiring ragflow_sdk
    requires_llm: marks tests as requiring LLM service
    skip_ci: marks tests to skip in CI environment

# 最小Python版本
minversion = 3.8

# 添加选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 超时配置
timeout = 300

# 异步测试配置
asyncio_mode = auto