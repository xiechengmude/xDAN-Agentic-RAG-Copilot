version: '3.8'

services:
  # PostgreSQL数据库 - 高并发优化配置
  postgres:
    image: postgres:16-alpine
    container_name: xdan_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xdan_rag_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      # 高并发优化设置
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
      POSTGRES_WORK_MEM: "4MB"
      POSTGRES_MAINTENANCE_WORK_MEM: "64MB"
      POSTGRES_MAX_CONNECTIONS: "200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xdan_rag_service"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - xdan_network

  # Redis缓存 (可选，用于会话管理和缓存)
  redis:
    image: redis:7-alpine
    container_name: xdan_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - xdan_network

  # pgAdmin管理界面 (开发环境)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: xdan_rag_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@xdan.ai
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - xdan_network
    profiles:
      - dev  # 只在开发环境启动

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  xdan_network:
    driver: bridge