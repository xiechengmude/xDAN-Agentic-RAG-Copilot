# Agentic-RAG-Service 配置文件
# 使用YAML格式进行配置管理

# ==================== RAGFlow 配置 ====================
ragflow:
  api_url: ${RAGFLOW_API_URL:http://150.109.16.195:7080}
  api_key: ${RAGFLOW_API_KEY:ragflow-g4ZWE3OTNhNDUxYTExZjA4MTljMDI0Mm}
  default_dataset_id: 7e8d9e924cde11f0afc90242ac140006

# ==================== LLM 提供商配置 ====================
llm_providers:
  # xDAN-R2-Qwen3模型（S3框架专用搜索模型）
  xdan_search:
    api_key: sk-empty
    base_url: http://209.20.158.204:8001/v1
    model_name: xDAN-R2-Qwen3-14b-RagRL-step450-0618
    # 专门训练的S3框架智能体模型
    
  # DeepSeek配置（成本较低，用于生成）
  deepseek:
    api_key: sk-6a32ae2b5dc440558aa628eec3dfda07
    base_url: https://api.deepseek.com/v1
    
  # OpenAI兼容接口（使用DeepSeek服务）
  openai:
    api_key: sk-6a32ae2b5dc440558aa628eec3dfda07
    base_url: https://api.deepseek.com/v1
    # 实际使用deepseek-chat模型，但通过OpenAI兼容接口
    
  # Anthropic配置（可选）
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}  # 从环境变量读取
    
  # Gemini配置（可选）
  gemini:
    api_key: ${GEMINI_API_KEY}  # 从环境变量读取

# ==================== 模型配置 ====================
models:
  # 默认模型 - 使用OpenAI兼容接口
  default_model: deepseek-chat
  
  # S3框架专用模型
  s3_framework:
    # 智能体推理模型（Select阶段）
    # 使用专门训练的xDAN-R2-Qwen3模型
    agent_model: xDAN-R2-Qwen3-14b-RagRL-step450-0618
    agent_provider: xdan_search  # 指定使用xdan_search提供商
    agent_temperature: 0.1
    agent_max_tokens: 4000
    
    # 答案生成模型（Synthesize阶段）
    # 使用DeepSeek进行成本优化的生成
    generation_model: deepseek-chat
    generation_provider: openai  # 使用OpenAI兼容接口
    generation_temperature: 0.7
    generation_max_tokens: 8192
  
  # 备用模型列表（按优先级排序）
  fallback_models:
    - deepseek-chat
    - gpt-4o-mini
    - claude-3-7-sonnet

# ==================== S3框架配置 ====================
s3_framework:
  # 搜索配置
  max_search_rounds: 5
  default_top_k: 10
  similarity_threshold: 0.1
  
  # 搜索策略
  search_strategy:
    enable_multi_round: true
    min_confidence_threshold: 0.7
    max_query_length: 200

# ==================== LiteLLM路由配置 ====================
litellm:
  # 路由配置
  routing:
    enabled: true
    strategy: cost-based  # cost-based, latency-based, usage-based
    retry_count: 3
    
  # 模型优先级和成本配置
  model_costs:
    deepseek-chat: 0.0001  # 每1k tokens
    gpt-4o: 0.005
    claude-3-7-sonnet: 0.003

# ==================== 数据库配置 ====================
database:
  # 数据库类型 - 仅支持PostgreSQL以确保高并发性能
  type: postgresql
  
  # PostgreSQL配置
  postgresql:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5433}
    database: ${DB_NAME:xdan_rag_service}
    username: ${DB_USER:ragflow_user}
    password: ${DB_PASSWORD:ragflow123}
    
    # 连接池配置 - 优化高并发性能
    pool:
      min_connections: 10
      max_connections: 50
      connection_timeout: 30
      idle_timeout: 600
      max_queries: 50000
      max_inactive_connection_lifetime: 300
      
    # SSL配置
    ssl:
      enabled: false
      mode: prefer  # disable, allow, prefer, require

# ==================== 服务配置 ====================
service:
  # 服务端口
  api_proxy_port: 8050
  rag_service_port: 8001
  
  # API配置
  api:
    cors_enabled: true
    cors_origins: ["*"]
    request_timeout: 300  # 秒
    
  # 健康检查
  health_check:
    enabled: true
    interval: 60  # 秒

# ==================== 日志配置 ====================
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  verbose: false
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 日志文件配置
  file:
    enabled: true
    path: logs/ragflow-api.log
    max_size: 100MB
    backup_count: 5

# ==================== 性能优化配置 ====================
performance:
  # 缓存配置
  cache:
    enabled: true
    ttl: 3600  # 秒
    max_size: 1000
    
  # 并发配置
  concurrency:
    max_workers: 10
    queue_size: 100
    
  # 批处理配置
  batch:
    enabled: true
    batch_size: 5
    timeout: 10  # 秒

# ==================== 外部服务配置 ====================
external_services:
  # BrightData SERP搜索配置
  brightdata:
    api_key: ${BRIGHTDATA_API_KEY:7f43b8faf2b1e3ccb9c6982c443d9138edc76fb0384bdc551d9ca2da5576ee4a}
    zone: ${BRIGHTDATA_ZONE:xdan_search_searp}
    base_url: "https://api.brightdata.com/request"
    max_concurrent: 5
    timeout: 30
    
  # FireCrawl网页爬取配置
  firecrawl:
    api_key: ${FIRECRAWL_API_KEY:fc-87533b34d5834363b71adc2d3870da92}
    base_url: "https://api.firecrawl.dev"
    timeout: 60
    max_pages: 10

# ==================== DeepSearch配置 ====================
deepsearch:
  # 搜索配置
  max_search_rounds: 5              # 最大搜索轮数（全局限制）
  max_results_per_round: 10         # 每轮搜索返回的结果数
  max_crawl_urls: 5                 # 每轮最多爬取的URL数（非全局总数）
  
  # 质量控制
  min_content_length: 500
  max_content_length: 20000
  relevance_threshold: 0.7
  
  # 并发控制
  max_concurrent_crawls: 3
  crawl_timeout: 60

# ==================== 可观察性配置 ====================
observability:
  # Langfuse配置 - LLM可观察性平台
  langfuse:
    enabled: false
    # 保留基础配置以便将来启用
    host: ${LANGFUSE_HOST:http://localhost:3000}
    public_key: ${LANGFUSE_PUBLIC_KEY:pk-lf-a9584006-ab4a-4301-a1a1-691eb6f0377a}
    secret_key: ${LANGFUSE_SECRET_KEY:sk-lf-e3aec777-8820-480f-95aa-37498c76cbe4}
    
  # 传统监控配置
  metrics:
    enabled: true
    export_interval: 60  # 秒
    prometheus:
      enabled: false
      port: 9090
    
  # OpenTelemetry追踪
  tracing:
    enabled: true
    sample_rate: 0.1
    exporters:
      - langfuse
      - jaeger  # 可选
    
  # 告警配置
  alerts:
    enabled: false
    webhook_url: ${ALERT_WEBHOOK_URL}