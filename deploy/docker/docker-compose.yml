version: '3.8'

services:
  # xDAN RAG Copilot API Backend
  xdan-rag-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: xdan-rag-api
    ports:
      - "8050:8050"
    environment:
      - ENVIRONMENT=production
      - PORT=8050
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - RAGFLOW_API_URL=http://150.109.16.195:7080
      - RAGFLOW_API_KEY=ragflow-g4ZWE3OTNhNDUxYTExZjA4MTljMDI0Mm
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - xdan-network

  # xDAN RAG Copilot Frontend
  xdan-rag-frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: xdan-rag-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://xdan-rag-api:8050
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_assets:/usr/share/nginx/html
      - ssl_certs:/etc/ssl/certs:ro
    depends_on:
      xdan-rag-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - xdan-network

  # Redis (可选 - 用于缓存)
  redis:
    image: redis:7-alpine
    container_name: xdan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - xdan-network

  # PostgreSQL (可选 - 用于数据存储)
  postgres:
    image: postgres:15-alpine
    container_name: xdan-postgres
    environment:
      - POSTGRES_DB=xdan_rag
      - POSTGRES_USER=xdan_user
      - POSTGRES_PASSWORD=xdan_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - xdan-network

  # Monitoring - Prometheus (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: xdan-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - xdan-network

  # Monitoring - Grafana (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: xdan-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - xdan-network

networks:
  xdan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  api_logs:
    driver: local
  frontend_assets:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  ssl_certs:
    driver: local